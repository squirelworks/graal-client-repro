name: javagraal

# Java Graal and its relay lobby (Java). Built and tested on Linux and Windows on every push
# and pull request that touches it. A manual run with a
# version (or release-all) also makes a DRAFT release with both jars; Squirrel
# reviews it and presses Publish.
on:
  push:
    branches: [main]
    paths: ['javagraal-2000/**', '.github/workflows/javagraal.yml']
  pull_request:
    paths: ['javagraal-2000/**', '.github/workflows/javagraal.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release as a draft, e.g. v0.0.1 (empty = build only)
        required: false
        default: ''
  # release-all.yml calls this to release every client in one run
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        description: yes = publish the release straight away, no = a draft
        type: string
        default: 'no'
      combined:
        description: yes = hand the zip to release-all for its one release, instead of a release of its own
        type: string
        default: 'no'

concurrency:
  group: javagraal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        shell: bash
        run: javagraal-2000/build.sh
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: javagraal
          path: |
            build/javagraal-2000/JavaGraal.jar
            build/javagraal-2000/GServ.jar
            build/javagraal-2000/smoke.png

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/javagraal-2000-v') || ((github.event_name == 'workflow_dispatch' || inputs.combined == 'yes') && inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: javagraal
          path: dist-in
      - name: Pack
        env:
          IN_VERSION: ${{ inputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          B=javagraal-2000
          if [ -n "$IN_VERSION" ]; then V="$IN_VERSION"; else V="v${TAG##*-v}"; fi
          OUT="$B-$V"
          mkdir -p "dist/$OUT"
          cp dist-in/JavaGraal.jar dist-in/GServ.jar "$B/README.md" "$B/RELEASE_NOTES.md" "$B/make_assets.py" "dist/$OUT/"
          (cd dist && zip -qr "$OUT.zip" "$OUT")
          echo "TAG_NAME=$B-$V" >> "$GITHUB_ENV"
          echo "TITLE=$(head -1 "$B/RELEASE_NOTES.md" | sed 's/^# *//') $V" >> "$GITHUB_ENV"
      - if: inputs.combined == 'yes'
        uses: actions/upload-artifact@v6
        with:
          name: release-all-javagraal
          path: dist/*.zip
      - if: inputs.combined != 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TITLE }}
          body_path: javagraal-2000/RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.publish != 'yes' }}
          files: dist/*.zip
