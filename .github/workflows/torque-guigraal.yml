name: torque-guigraal

on:
  pull_request:
    paths:
      - 'common/torque/guigraal/**'
      - 'common/torque/console/engine/**'
      - 'common/torque/console/compiler/**'
      - 'common/torque/gui/**'
      - 'common/cpp/third_party/stb/**'
      - 'graal-3.04-G3D03014/src/**'
      - 'graal-3.153-G3D28015/src/**'
      - 'graal-3.0beta-G3D16053/src/**'
      - 'graal-3.01-G3D27063/src/**'
      - 'graal-3.151-G3D27015/src/**'
      - 'common/*.pas'
      - '.github/workflows/torque-guigraal.yml'
  push:
    branches: [main]
    paths:
      - 'common/torque/guigraal/**'
      - 'common/torque/console/engine/**'
      - 'common/torque/console/compiler/**'
      - 'common/torque/gui/**'
      - 'common/cpp/third_party/stb/**'
      - 'graal-3.04-G3D03014/src/**'
      - 'graal-3.153-G3D28015/src/**'
      - 'graal-3.0beta-G3D16053/src/**'
      - 'graal-3.01-G3D27063/src/**'
      - 'graal-3.151-G3D27015/src/**'
      - 'common/*.pas'
      - '.github/workflows/torque-guigraal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torque-guigraal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # macOS is built and tested on the lab Sequoia VM, not on GitHub runners
    # (AGENTS.md, "macOS builds").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl libx11-dev xvfb
      - name: Control tests (fake game)
        run: make -C common/torque/guigraal test
      - name: Control tests with address and undefined behavior sanitizers
        run: |
          make -C common/torque/guigraal clean
          make -C common/torque/guigraal test CXXFLAGS='-std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          make -C common/torque/guigraal clean
      - name: Game library and tq-play, end to end
        run: |
          make -C common/torque/guigraal lib all
          sh common/torque/guigraal/tests/smoke.sh
      - name: Online path against loopback list and game servers
        run: |
          sh common/torque/guigraal/tests/online.sh
          GAME_LIB=libGame3153Lib.so GAME_TOKEN=G3D28015 sh common/torque/guigraal/tests/online.sh
          GAME_LIB=libGame30bLib.so GAME_TOKEN=G3D16053 sh common/torque/guigraal/tests/online.sh
          GAME_LIB=libGame301Lib.so GAME_TOKEN=G3D27063 sh common/torque/guigraal/tests/online.sh
          GAME_LIB=libGame3151Lib.so GAME_TOKEN=G3D27015 sh common/torque/guigraal/tests/online.sh
          LIST_FALLBACK=1 sh common/torque/guigraal/tests/online.sh
      - name: The windowed program on Xvfb
        run: xvfb-run -a sh common/torque/guigraal/tests/window.sh

  windows:
    # The Windows release's pair: Chocolatey's i386-win32 Free Pascal and
    # MSYS2's 32-bit MinGW g++, so the exe can load the game DLL.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Free Pascal
        shell: pwsh
        run: choco install freepascal -y --no-progress
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            make
            python
            mingw-w64-i686-gcc
            mingw-w64-i686-zlib
      - name: Control tests
        shell: msys2 {0}
        run: make -C common/torque/guigraal test
      - name: Game library and the Win32 program
        shell: msys2 {0}
        run: |
          FPCBIN=$(ls -d /c/tools/freepascal/bin/*/fpc.exe | head -1)
          make -C common/torque/guigraal lib all FPC="$FPCBIN" \
            FPCFLAGS='-FuC:\tools\freepascal\units\i386-win32\*'
          objdump -p common/torque/guigraal/build/graal304-torque.exe | grep 'DLL Name'
      - name: tq-play end to end, the window, and the online path
        shell: msys2 {0}
        run: |
          sh common/torque/guigraal/tests/smoke.sh
          sh common/torque/guigraal/tests/window.sh
          sh common/torque/guigraal/tests/online.sh
          GAME_LIB=Game3153Lib.dll GAME_TOKEN=G3D28015 sh common/torque/guigraal/tests/online.sh
