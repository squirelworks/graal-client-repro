name: release

# One release per rebuilt client. Push a tag named after the build folder,
# e.g. graal-2.05r2-GNW03081, and this builds that folder on Linux and
# Windows and attaches the binaries to the release of the same name.
on:
  push:
    tags: ['graal-*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag names a build folder
        shell: bash
        run: test -d "$GITHUB_REF_NAME/src"
      - name: Install Free Pascal (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl fp-units-x11
      - name: Install Free Pascal (Windows)
        if: runner.os == 'Windows'
        run: choco install freepascal -y --no-progress
      - name: Build and test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$(ls -d /c/tools/freepascal/bin/* | head -1):$PATH"; fi
          scripts/build.sh "$GITHUB_REF_NAME"
          scripts/test.sh
      - name: Pack
        shell: bash
        run: |
          OUT="$GITHUB_REF_NAME-${RUNNER_OS,,}"
          mkdir -p "dist/$OUT"
          for F in build/"$GITHUB_REF_NAME"/*; do
            case "$F" in *.o|*.ppu|*.a|*.bmp) ;; *) [ -f "$F" ] && [ -x "$F" -o "${F##*.}" = exe ] && cp "$F" "dist/$OUT/";; esac
          done
          cp "$GITHUB_REF_NAME/README.md" "dist/$OUT/"
          cd dist && 7z a "$OUT.zip" "$OUT" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/**/*.zip
