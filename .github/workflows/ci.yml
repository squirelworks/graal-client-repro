name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push replaces the run still going for the same branch or PR, so
# runs that wait on a runner do not pile up.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which client folders this run builds. A pull request builds only the
  # Pascal code folders it touches. Shared Pascal/build glue selects all.
  # Dedicated host workflows do not replace this shared-code coverage.
  changes:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.pick.outputs.builds }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test changed-code selection
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # graal-3d-* is left to graal-3d.yml, which builds and tests it
          # on Linux and Windows already
          ALL=$(ls -d graal-*/ | tr -d / | grep -v '^graal-3d-' | tr '\n' ' ')
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then B="$ALL"
          else
            B=$(git diff --name-only "$BASE...$HEAD" | python3 scripts/ci/select_pascal_builds.py)
          fi
          B=$(echo $B)
          echo "builds=$B" >> "$GITHUB_OUTPUT"
          echo "Builds: ${B:-none}"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.builds != ''
    runs-on: ubuntu-latest
    env:
      BUILDS: ${{ needs.changes.outputs.builds }}
    steps:
      - uses: actions/checkout@v5
      # Free Pascal and the other build packages come from a cache of
      # their .deb files, keyed on the runner image, so a run needs the
      # Ubuntu mirrors only when the image changes. A mirror outage then
      # fails this job only on an image change, not on every PR.
      - name: Cached build packages
        id: debs
        uses: actions/cache@v5
        with:
          path: ~/fpc-debs
          key: fpc-debs-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-v1
      - name: Download the build packages
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          # A second mirror, outside Azure, for when the runners cannot
          # resolve the Ubuntu archive (2026-11-11). apt's mirror list
          # falls back to it in order.
          echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee -a /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --download-only fp-compiler fp-units-base fp-units-fcl libx11-dev g++ zlib1g-dev mono-devel
          mkdir -p ~/fpc-debs
          cp /var/cache/apt/archives/*.deb ~/fpc-debs/
      - name: Install Free Pascal
        run: |
          sudo dpkg -i --skip-same-version ~/fpc-debs/*.deb
          fpc -iV
      - name: Every client has its Windows resources
        run: python3 scripts/win/make_winres.py --check
      - name: Build (Delphi mode)
        run: scripts/build.sh $BUILDS
      - name: Unit tests
        run: scripts/test.sh
      # A tar keeps the execute bits that loopback needs; artifacts drop them.
      - name: Pack the build
        run: tar cf linux-build.tar build
      - uses: actions/upload-artifact@v6
        with:
          name: linux-build
          path: linux-build.tar

  loopback:
    needs: [changes, build-and-test]
    runs-on: ubuntu-latest
    env:
      BUILDS: ${{ needs.changes.outputs.builds }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: squirelworks/seihai-gserver
          path: seihai-gserver
      - uses: dtolnay/rust-toolchain@stable
      # The gserver's dependencies are cached between runs; only its own
      # crates are rebuilt.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: seihai-gserver
      - name: Build seihai-gserver
        run: cargo build --release --manifest-path seihai-gserver/Cargo.toml
      # The clients build-and-test just built and tested, so loopback needs
      # no compiler and no apt step of its own.
      - uses: actions/download-artifact@v7
        with:
          name: linux-build
      - name: Unpack the build
        run: tar xf linux-build.tar
      - name: Log each rebuild into seihai-gserver
        run: |
          . scripts/v7.sh
          for B in $BUILDS; do
            # v7 (Worlds) is not blocking until there is more v7 research
            if is_v7 "$B"; then
              scripts/loopback.sh seihai-gserver/target/release/seihai-gserver "$B" || v7_warn "$B" "loopback failed"
            else
              scripts/loopback.sh seihai-gserver/target/release/seihai-gserver "$B"
            fi
          done

  windows:
    # Chocolatey's Free Pascal is the 32-bit i386-win32 compiler. That is
    # the target 2.05 itself shipped for, so it is kept.
    needs: changes
    if: needs.changes.outputs.builds != ''
    runs-on: windows-latest
    env:
      BUILDS: ${{ needs.changes.outputs.builds }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Free Pascal
        shell: pwsh
        run: choco install freepascal -y --no-progress
      - name: Build and test
        shell: bash
        run: |
          export PATH="$(ls -d /c/tools/freepascal/bin/* | head -1):$PATH"
          # The Chocolatey install has no fpc.cfg naming the unit folders,
          # so name them here (Windows path form, with FPC's * wildcard).
          # -WR: relocations, so the exe can carry the ASLR flag
          export FPCFLAGS='-O2 -WR -FuC:\tools\freepascal\units\i386-win32\*'
          ls /c/tools/freepascal/units/i386-win32 | head -5
          scripts/build.sh $BUILDS
          scripts/test.sh
      - name: Check the clients carry version info and a manifest
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem build/*/Graal*.exe) {
            # v7 (Worlds) is not blocking (scripts/v7.sh)
            if ($exe.Directory.Name -like 'graal-worlds-*') { "::warning::$($exe.Directory.Name) (v7, not blocking): not checked"; continue }
            $v = $exe.VersionInfo
            "{0}: {1} {2} / {3}" -f $exe.Directory.Name, $v.ProductName, $v.ProductVersion, $v.FileDescription
            if ($v.ProductName -ne 'graal-delphi' -or $v.CompanyName -ne 'squirelworks') { throw "$($exe.FullName): no version info" }
            $bytes = [IO.File]::ReadAllBytes($exe.FullName)
            if ([Text.Encoding]::ASCII.GetString($bytes).IndexOf('requestedExecutionLevel') -lt 0) { throw "$($exe.FullName): no manifest" }
          }
      # the Windows programs of this run, for trying a PR on a Windows PC
      - uses: actions/upload-artifact@v6
        with:
          name: windows-programs
          path: build/*/*.exe

