name: frankenstein-6037

# Community experimental client (frankenstein-6037/): a v6.037 host with
# v5.120 Graal3D folded in, UDP left enabled. Scaffold only until a real
# client exists. Separate from frankenstein/ (v6.113) and from its workflow.
#
# Separate from ci.yml, macos.yml, and release-all.yml. Path filters keep
# this workflow off other clients' pulls and pushes, including
# frankenstein/**. release-all.yml does not call this file. Releases use
# the tag prefix frankenstein-6037-v (frankenstein-6037-v0.0.1) and are
# drafts until someone publishes them.
#
# The build job compiles frankenstein-6037 (common/cpp/quattro on the
# 6.03r7 row plus the 5.12 Graal3D link from common/cpp/graal3dengine) on
# macOS, Linux and Windows and runs its loopback test.

on:
  push:
    branches: [main]
    paths:
      - 'frankenstein-6037/**'
      - 'common/cpp/quattro/**'
      - 'common/cpp/graal3dengine/src/**'
      - 'common/cpp/gs2/*.cpp'
      - 'common/cpp/gs2/*.hpp'
      - 'common/torque/gui/*.cpp'
      - 'common/torque/gui/*.hpp'
      - '.github/workflows/frankenstein-6037.yml'
  pull_request:
    paths:
      - 'frankenstein-6037/**'
      - 'common/cpp/quattro/**'
      - 'common/cpp/graal3dengine/src/**'
      - 'common/cpp/gs2/*.cpp'
      - 'common/cpp/gs2/*.hpp'
      - 'common/torque/gui/*.cpp'
      - 'common/torque/gui/*.hpp'
      - '.github/workflows/frankenstein-6037.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Three-part version to draft-release, e.g. v0.0.1 (empty = build only)
        required: false
        default: ''
      publish:
        description: Publish straight away (no = draft)
        type: choice
        options: ['yes', 'no']
        default: 'no'

concurrency:
  group: frankenstein-6037-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS first: the Graal3D test build.
          - os: macos-15
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install zlib, bzip2 and Xlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ make zlib1g-dev libbz2-dev libx11-dev
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-bzip2
      - name: Build and test (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: frankenstein-6037/test.sh
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: frankenstein-6037/test.sh
      - uses: actions/upload-artifact@v6
        with:
          name: frankenstein-6037-${{ matrix.name }}
          path: build/frankenstein-6037/

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: frankenstein-6037-*
          path: dist-in
      - name: Pack macOS, Linux, and Windows zips
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          V="$IN_VERSION"
          case "$V" in
            v*.*.*.*) echo "version must be three parts, like v0.0.1"; exit 1 ;;
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like v0.0.1"; exit 1 ;;
          esac
          mkdir -p dist
          for spec in macos linux windows; do
            src="dist-in/frankenstein-6037-$spec"
            test -s "$src/MANIFEST.txt"
            grep -q '^name: frankenstein-6037$' "$src/MANIFEST.txt"
            grep -q '^base: v6.037$' "$src/MANIFEST.txt"
            grep -q '^udp: enabled$' "$src/MANIFEST.txt"
            stage="dist/frankenstein-6037-$V-$spec"
            mkdir -p "$stage"
            cp -a "$src/." "$stage/"
            cp frankenstein-6037/README.md frankenstein-6037/RELEASE_NOTES.md frankenstein-6037/VERSION "$stage/"
            (cd dist && zip -qr "frankenstein-6037-$V-$spec.zip" "frankenstein-6037-$V-$spec")
          done
          echo "TAG_NAME=frankenstein-6037-$V" >> "$GITHUB_ENV"
          echo "TITLE=Frankenstein 6.037 $V" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TITLE }}
          body_path: frankenstein-6037/RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.publish != 'yes' }}
          files: dist/*.zip
          make_latest: false
